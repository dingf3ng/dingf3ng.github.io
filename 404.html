    <title>Ding Feng</title>
    <script type="text/javascript">
      // The app uses HashRouter, so real routes live after "#".
      // GitHub Pages serves this file for unknown paths like /gallery;
      // forward them to the hash route, e.g. /gallery?a=b -> /#/gallery?a=b
      var l = window.location;
      l.replace('/#' + l.pathname + l.search);
    </script>
